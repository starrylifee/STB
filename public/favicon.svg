<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB7C5"/>
      <stop offset="100%" style="stop-color:#FF6B9D"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7FD4A0"/>
      <stop offset="100%" style="stop-color:#4CAF50"/>
    </linearGradient>
  </defs>
  <!-- Flower petals -->
  <ellipse cx="50" cy="30" rx="12" ry="18" fill="url(#petalGrad)" transform="rotate(0 50 50)"/>
  <ellipse cx="50" cy="30" rx="12" ry="18" fill="url(#petalGrad)" transform="rotate(72 50 50)"/>
  <ellipse cx="50" cy="30" rx="12" ry="18" fill="url(#petalGrad)" transform="rotate(144 50 50)"/>
  <ellipse cx="50" cy="30" rx="12" ry="18" fill="url(#petalGrad)" transform="rotate(216 50 50)"/>
  <ellipse cx="50" cy="30" rx="12" ry="18" fill="url(#petalGrad)" transform="rotate(288 50 50)"/>
  <!-- Center -->
  <circle cx="50" cy="50" r="10" fill="#FFE066"/>
  <!-- Leaf -->
  <path d="M50 65 Q35 80 50 95 Q65 80 50 65" fill="url(#leafGrad)"/>
